<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(201, 171, 112, 0.3)"/>
    </pattern>
    <pattern id="major-grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.25"/>
      <circle cx="0" cy="0" r="2.5" fill="rgba(201, 171, 112, 0.6)"/>
    </pattern>
    <linearGradient id="blueprint-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c9ab70" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a4958" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Grid Fill -->
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />
  <rect width="100%" height="100%" fill="url(#major-grid)" />

  <!-- Isometric & Architectural Drafting Schematics -->
  <g stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perspective Horizon & Guideline Vectors -->
    <line x1="120" y1="180" x2="1800" y2="180" stroke-dasharray="8 6" stroke="rgba(201, 171, 112, 0.4)"/>
    <line x1="120" y1="920" x2="1800" y2="920" stroke-dasharray="8 6" stroke="rgba(255, 255, 255, 0.2)"/>
    <line x1="280" y1="80" x2="280" y2="1020" stroke-dasharray="12 8" stroke="rgba(255, 255, 255, 0.25)"/>
    <line x1="1640" y1="80" x2="1640" y2="1020" stroke-dasharray="12 8" stroke="rgba(255, 255, 255, 0.2)"/>

    <!-- Left Architectural Node Block (Blueprint Geometry) -->
    <rect x="240" y="240" width="480" height="320" rx="4" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>
    <line x1="240" y1="280" x2="720" y2="280" stroke="rgba(255, 255, 255, 0.3)"/>
    <line x1="240" y1="360" x2="720" y2="360" stroke-dasharray="4 4" stroke="rgba(255, 255, 255, 0.2)"/>
    <line x1="480" y1="280" x2="480" y2="560" stroke="rgba(255, 255, 255, 0.25)"/>
    <circle cx="480" cy="420" r="90" stroke="rgba(201, 171, 112, 0.35)" stroke-dasharray="6 4"/>
    <circle cx="480" cy="420" r="45" stroke="rgba(255, 255, 255, 0.3)"/>
    <line x1="390" y1="420" x2="570" y2="420" stroke="rgba(201, 171, 112, 0.5)"/>
    <line x1="480" y1="330" x2="480" y2="510" stroke="rgba(201, 171, 112, 0.5)"/>

    <!-- Isometric Projection Geometry -->
    <path d="M 840 380 L 1140 210 L 1440 380 L 1140 550 Z" fill="rgba(255, 255, 255, 0.015)" stroke="url(#blueprint-glow)" stroke-width="1.8"/>
    <path d="M 840 380 L 840 680 L 1140 850 L 1140 550 Z" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.4)"/>
    <path d="M 1140 550 L 1140 850 L 1440 680 L 1440 380 Z" fill="rgba(255, 255, 255, 0.01)" stroke="rgba(255, 255, 255, 0.3)"/>

    <!-- Isometric Internal Rib Lines -->
    <line x1="990" y1="295" x2="990" y2="765" stroke="rgba(255, 255, 255, 0.2)" stroke-dasharray="6 4"/>
    <line x1="1290" y1="295" x2="1290" y2="765" stroke="rgba(255, 255, 255, 0.2)" stroke-dasharray="6 4"/>
    <line x1="840" y1="530" x2="1140" y2="700" stroke="rgba(255, 255, 255, 0.2)"/>
    <line x1="1140" y1="700" x2="1440" y2="530" stroke="rgba(255, 255, 255, 0.2)"/>

    <!-- Caliper & Radial Arc Drafts -->
    <circle cx="1140" cy="550" r="280" stroke="rgba(201, 171, 112, 0.25)" stroke-dasharray="4 8"/>
    <circle cx="1140" cy="550" r="320" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="2 12"/>
    <circle cx="1140" cy="550" r="4" fill="#c9ab70"/>

    <!-- Dimension Annotation Marks -->
    <path d="M 220 240 L 210 240 M 220 560 L 210 560 M 215 240 L 215 560" stroke="#c9ab70" stroke-width="1.2"/>
    <path d="M 240 220 L 240 210 M 720 220 L 720 210 M 240 215 L 720 215" stroke="#c9ab70" stroke-width="1.2"/>

    <!-- Diagonal Rulers & Coordinate Crosshairs -->
    <line x1="100" y1="100" x2="1820" y2="980" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="2 10"/>
    <line x1="1820" y1="100" x2="100" y2="980" stroke="rgba(255, 255, 255, 0.08)" stroke-dasharray="2 10"/>

    <!-- Subtle Technical Drafting Text Markers -->
    <g fill="rgba(255, 255, 255, 0.45)" font-family="monospace" font-size="9" letter-spacing="2">
      <text x="230" y="205">DIM: 480x320 MODULE_A1</text>
      <text x="840" y="195">PERSPECTIVE: ISO_30_DEG</text>
      <text x="1155" y="870">ELEVATION_Z: +102.50</text>
      <text x="1455" y="385">SEC_R3 // 1440.380</text>
      <text x="230" y="585">SYS_GRID_ALIGN // 0.075</text>
    </g>
  </g>
</svg>
